<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>旅途人格研究所｜生日旅行测试</title><style>:root{font-family:system-ui,-apple-system,'PingFang SC',sans-serif;color:#233044;background:#f4f7f8}*{box-sizing:border-box}body{margin:0}.wrap{max-width:720px;margin:auto;padding:22px 18px 60px}.hero{background:linear-gradient(135deg,#184d60,#4b8e82);color:white;border-radius:24px;padding:28px 24px;margin:12px 0 20px}.hero h1{font-size:30px;margin:8px 0}.hero p{line-height:1.7;opacity:.9}.pill{font-size:12px;border:1px solid #ffffff88;padding:5px 10px;border-radius:20px}.card{background:white;padding:22px;border-radius:20px;box-shadow:0 6px 24px #142f4510;margin:14px 0}h2{font-size:20px;margin:0 0 14px}.muted{color:#64748b;font-size:13px;line-height:1.7}.field{margin:16px 0}label{display:block;font-weight:650;margin-bottom:8px}input,select{width:100%;padding:13px;border:1px solid #d6e0e5;border-radius:12px;font-size:16px;background:white}.q{margin:24px 0;border-top:1px solid #eef2f4;padding-top:18px}.opt{display:block;padding:13px;border:1px solid #dbe3e8;border-radius:12px;margin:8px 0;cursor:pointer;font-weight:400}.opt:has(input:checked){background:#eaf7f3;border-color:#2d8a75}.opt input{width:auto;margin-right:10px}button{background:#146d68;color:white;border:0;border-radius:13px;padding:15px 20px;font-size:16px;font-weight:700;cursor:pointer;width:100%;margin-top:10px}button.secondary{background:#edf4f4;color:#245a5c}.hide{display:none}.result-head{border-radius:18px;padding:23px;color:white;background:linear-gradient(125deg,#226c76,#91a87b)}.rank{display:flex;gap:12px;align-items:flex-start;border-bottom:1px solid #edf1f2;padding:16px 0}.rank b{font-size:17px}.num{background:#e5f2ed;color:#276b60;border-radius:12px;padding:8px 12px;font-weight:800}.bar{height:8px;border-radius:8px;background:#e9eff1;margin:8px 0}.fill{height:100%;background:#4b9a87;border-radius:8px}.small{font-size:12px;color:#64748b}footer{font-size:12px;color:#718096;line-height:1.7;margin-top:25px}@media print{button,.hero,.intro{display:none!important}.wrap{max-width:none}.card{box-shadow:none;border:1px solid #ddd}}</style></head><body><main class="wrap"><header class="hero"><span class="pill">旅途人格研究所 · V0.1</span><h1>你的生日，适合哪种旅行？</h1><p>用生日文化灵感与真实旅行偏好，找到你的专属目的地。不是算命，是一次有趣的旅行自我发现。</p></header><section id="form" class="card"><h2>先认识你</h2><div class="field"><label for="birthday">出生日期（可选）</label><input id="birthday" type="date" min="1920-01-01" max="2026-11-19"><div class="muted">仅在本机浏览器中计算趣味生日标签，不上传或保存。</div></div><div class="field"><label for="origin">通常从哪里出发？</label><select id="origin"><option value="cn">中国大陆</option><option value="other">其他地区</option></select></div><div id="questions"></div><button id="submit">生成我的旅行匹配报告</button><p id="error" class="muted" role="alert"></p></section><section id="result" class="hide"><div class="card"><div class="result-head"><div class="small" style="color:#e8f8f4">我的旅行人格</div><h1 id="persona"></h1><p id="personaDesc"></p><p id="birthdayTag"></p></div><h2 style="margin-top:25px">最适合你的 5 个目的地</h2><div id="ranking"></div><h2>你的偏好雷达（文字版）</h2><div id="traits"></div><div class="card" style="background:#f4f8f7"><b>出发前的小提醒</b><p class="muted">目的地匹配是基于你的答题偏好，不代表实际签证、天气、交通或安全情况。预订前请核实官方信息。</p></div><button id="share">复制我的结果文案</button><button class="secondary" id="print">打印 / 保存为 PDF</button><button class="secondary" id="again">重新测试</button></div></section><footer>本产品为文化灵感与旅行偏好娱乐测试，不提供八字预测、运势、改运、医疗或财务建议。生日仅影响趣味标签，不影响目的地排序。所有数据在本地处理，无服务器传输。</footer></main><script>
const questions=[
['旅行最想获得什么？',['彻底放松','探索未知','拍出好照片','了解文化'],['relax','adventure','photo','culture']],
['最喜欢的风景？',['海岛与沙滩','山川与森林','繁华城市','古镇与建筑'],['sea','nature','city','culture']],
['理想的旅行节奏？',['慢慢待着','每天安排一两个点','紧凑打卡','随机探索'],['relax','balanced','city','adventure']],
['你更喜欢哪种气候？',['温暖阳光','清凉舒适','四季分明','都可以'],['warm','cool','balanced','neutral']],
['预算偏好（每人单次旅行，不含购物）？',['3000元以内','3000–7000元','7000–15000元','预算灵活'],['low','medium','high','flex']],
['能接受的飞行或交通时间？',['尽量短','6小时以内','12小时以内','远一点也值得'],['near','mid','far','any']],
['旅行中最期待哪项活动？',['海边放空','徒步看自然','逛街咖啡馆','逛博物馆和古迹'],['sea','nature','city','culture']],
['住宿偏好？',['舒适度假酒店','山景民宿','市中心酒店','有特色的传统旅宿'],['relax','nature','city','culture']],
['对人群密度的偏好？',['越清静越好','适度热闹','越热闹越有趣','无所谓'],['quiet','balanced','lively','neutral']],
['对陌生环境的接受度？',['更熟悉方便','可以小小冒险','越新鲜越好','看心情'],['easy','balanced','adventure','neutral']],
['更喜欢哪种旅行内容？',['美食','摄影','户外运动','历史人文'],['food','photo','adventure','culture']],
['哪种旅行画面最打动你？',['落日海滩','清晨山谷','霓虹街景','古老街巷'],['sea','nature','city','culture']]
];
const destinations=[
{name:'京都 · 日本',tags:['culture','photo','cool','balanced','quiet','easy','near','mid','medium'],desc:'古寺、庭院与传统街巷，适合文化摄影和慢节奏漫游。',tip:'春秋通常更适合步行；热门季节人流较多。'},
{name:'巴厘岛 · 印度尼西亚',tags:['sea','relax','warm','photo','medium','mid','high','balanced'],desc:'热带海岸、稻田和度假氛围，适合放松与风景摄影。',tip:'留意雨季、当地交通及海上活动安全。'},
{name:'清迈 · 泰国',tags:['nature','culture','relax','warm','low','medium','mid','quiet','food'],desc:'山地、寺庙、咖啡馆和慢生活，适合悠闲探索。',tip:'关注季节性空气质量。'},
{name:'厦门 · 中国',tags:['sea','culture','photo','warm','low','near','easy','balanced'],desc:'海岸、街巷与城市生活结合，适合轻松周末游。',tip:'节假日热门景区较拥挤。'},
{name:'大理 · 中国',tags:['nature','relax','photo','quiet','medium','low','near','balanced'],desc:'苍山洱海与古城氛围，适合慢旅行和摄影。',tip:'注意高原紫外线及昼夜温差。'},
{name:'三亚 · 中国',tags:['sea','relax','warm','high','medium','near','easy'],desc:'海滩和度假酒店资源丰富，适合休闲度假。',tip:'留意台风季及旺季酒店价格。'},
{name:'杭州 · 中国',tags:['culture','nature','food','photo','near','low','easy','balanced'],desc:'湖景、园林、茶文化与城市便利兼具。',tip:'节假日西湖周边可能拥堵。'},
{name:'桂林 · 中国',tags:['nature','photo','adventure','low','medium','near','quiet'],desc:'喀斯特山水与田园风景，适合自然摄影。',tip:'关注降雨、江河水位及户外活动条件。'},
{name:'东京 · 日本',tags:['city','food','photo','lively','high','medium','easy','mid'],desc:'都市文化、购物和美食丰富，适合高密度城市探索。',tip:'预算和交通规划值得提前准备。'},
{name:'首尔 · 韩国',tags:['city','food','photo','lively','medium','mid','easy'],desc:'街区、咖啡馆与潮流文化，适合城市打卡。',tip:'提前核实入境要求。'},
{name:'岘港 · 越南',tags:['sea','relax','warm','medium','low','mid','photo'],desc:'海滩与城市休闲兼备，适合性价比海滨旅行。',tip:'关注季节性暴雨和台风。'},
{name:'皇后镇 · 新西兰',tags:['nature','adventure','photo','cool','far','any','high','quiet'],desc:'湖泊、山地和户外运动，适合自然风景与冒险。',tip:'远程旅行成本较高，户外活动受天气影响。'},
{name:'瑞士卢塞恩',tags:['nature','photo','cool','far','high','quiet','relax'],desc:'湖光山色与历史城区，适合风景摄影和轻徒步。',tip:'交通和住宿预算相对较高。'},
{name:'新加坡',tags:['city','food','warm','easy','mid','medium','lively'],desc:'城市花园、建筑与多元美食，适合便捷城市旅行。',tip:'全年较热且湿度较高。'},
{name:'丽江 · 中国',tags:['nature','culture','photo','quiet','medium','near','adventure'],desc:'古城、雪山与高原风景，适合文化和自然结合的旅行。',tip:'留意海拔及天气变化。'},
{name:'成都 · 中国',tags:['food','culture','city','relax','low','near','easy'],desc:'美食、茶馆和城市文化，适合轻松逛吃。',tip:'热门景点提前预约。'},
{name:'香港 · 中国',tags:['city','food','photo','lively','medium','near','easy'],desc:'高密度都市、山海景观和美食，适合城市摄影。',tip:'留意住宿成本和入境证件。'},
{name:'张家界 · 中国',tags:['nature','adventure','photo','near','medium','quiet'],desc:'独特峰林与徒步观景，适合自然探索。',tip:'山地天气变化快。'},
{name:'普吉岛 · 泰国',tags:['sea','relax','warm','medium','mid','photo','lively'],desc:'海岛休闲与水上活动丰富，适合阳光假期。',tip:'注意海况及雨季安全。'},
{name:'苏州 · 中国',tags:['culture','photo','relax','near','low','quiet','easy'],desc:'园林、水巷与传统建筑，适合安静的文化漫游。',tip:'热门园林需提前预约。'}
];
const weights=[3,4,2,2,3,3,4,2,2,2,3,4];
const qroot=document.getElementById('questions');questions.forEach((q,i)=>{let block=document.createElement('div');block.className='q';let title=document.createElement('label');title.textContent=`${i+1}. ${q[0]}`;block.append(title);q[1].forEach((option,j)=>{let l=document.createElement('label');l.className='opt';let input=document.createElement('input');input.type='radio';input.name='q'+i;input.value=q[2][j];l.append(input,document.createTextNode(option));block.append(l)});qroot.append(block)});
let latest=[];let personaText='';function birthdayInfo(date){if(!date)return '未填写生日 · 自由旅人';const [y,m,d]=date.split('-').map(Number);const seasons=['','冬','冬','春','春','春','夏','夏','夏','秋','秋','秋','冬'];const motifs=['','山岚','星野','晨光','林间','海风','云游','花径','远山','秋叶','微光','晴空','雪原'];return `${seasons[m]}日出生 · ${motifs[m]}旅人 · 生日数字${String(y+m+d).split('').reduce((a,c)=>a+Number(c),0)%9||9}`}
function run(){const answers=questions.map((_,i)=>document.querySelector(`input[name=q${i}]:checked`)?.value);if(answers.some(a=>!a)){document.getElementById('error').textContent='请完成全部12道题后再生成结果。';return}const scores=destinations.map((d,index)=>{let score=0;answers.forEach((a,i)=>{if(d.tags.includes(a))score+=weights[i]});if(answers[4]==='low'&&d.tags.includes('high'))score-=5;if(answers[5]==='near'&&(d.tags.includes('far')||d.tags.includes('any')))score-=6;if(answers[5]==='mid'&&d.tags.includes('far'))score-=4;if(document.getElementById('origin').value==='other'&&d.tags.includes('near'))score-=1;return {...d,score,index}}).sort((a,b)=>b.score-a.score||a.index-b.index);latest=scores.slice(0,5);const counts={};answers.forEach(a=>counts[a]=(counts[a]||0)+1);const profiles=[['sea','海风疗愈家','喜欢海岸、阳光与自在的节奏'],['nature','山野探索家','被山林与自然风景吸引'],['city','都市漫游家','偏爱城市街区与丰富体验'],['culture','人文收藏家','喜欢古迹、建筑与地方故事'],['relax','慢旅行生活家','重视松弛感与舒适体验'],['adventure','自由探险家','愿意为未知体验走远一点'],['photo','光影记录家','喜欢用照片收藏旅行瞬间']];profiles.sort((a,b)=>(counts[b[0]]||0)-(counts[a[0]]||0));personaText=profiles[0][1];document.getElementById('persona').textContent=personaText;document.getElementById('personaDesc').textContent=profiles[0][2]+'。';document.getElementById('birthdayTag').textContent='生日文化标签：'+birthdayInfo(document.getElementById('birthday').value);document.getElementById('ranking').innerHTML=latest.map((d,i)=>`<div class="rank"><span class="num">${i+1}</span><div><b>${d.name}</b><p class="muted">${d.desc}</p><p class="small">旅行提醒：${d.tip}</p><span class="small">偏好匹配得分：${Math.max(0,d.score)}（相对分数，非成功率）</span></div></div>`).join('');let groups=[['自然', ['nature','sea']],['城市',['city','food']],['文化',['culture']],['放松',['relax','quiet']],['探索',['adventure']],['摄影',['photo']]];document.getElementById('traits').innerHTML=groups.map(([name,tags])=>{let v=answers.filter(a=>tags.includes(a)).length;return `<div style="margin:12px 0"><div class="small">${name} · ${v} 次偏好选择</div><div class="bar"><div class="fill" style="width:${Math.min(100,v/4*100)}%"></div></div></div>`}).join('');document.getElementById('form').classList.add('hide');document.getElementById('result').classList.remove('hide');window.scrollTo({top:0,behavior:'smooth'})}
document.getElementById('submit').onclick=run;document.getElementById('again').onclick=()=>{document.getElementById('result').classList.add('hide');document.getElementById('form').classList.remove('hide');window.scrollTo(0,0)};document.getElementById('print').onclick=()=>window.print();document.getElementById('share').onclick=async()=>{const t=`我的旅行人格：${personaText}\n最匹配的旅行地：${latest.map((x,i)=>`${i+1}. ${x.name}`).join('、')}\n来自「旅途人格研究所」趣味测试`;try{await navigator.clipboard.writeText(t);alert('结果文案已复制')}catch(e){prompt('请长按复制：',t)}};
</script></body></html>
